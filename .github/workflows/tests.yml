name: Tests

on:
  push:
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.2
            laravel: 11.*
            testbench: ^9.18.0
            pest: ^3.8.0
          - php: 8.2
            laravel: 12.*
            testbench: ^10.12.0
            pest: ^3.8.0
          - php: 8.3
            laravel: 12.*
            testbench: ^10.12.0
            pest: ^4.7.0
          - php: 8.3
            laravel: 13.*
            testbench: ^11.3.0
            pest: ^4.7.0
          - php: 8.4
            laravel: 13.*
            testbench: ^11.3.0
            pest: ^5.3.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, dom, zip
          coverage: none

      - name: Install dependencies
        run: |
          # Laravel 11 is past security support; Composer blocks it by default. Allow it only for this CI leg.
          if [[ "${{ matrix.laravel }}" == 11.* ]]; then composer config policy.advisories.block false; fi
          composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
